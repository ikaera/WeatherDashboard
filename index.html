<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A modern weather dashboard with real-time forecasts, alerts, and offline support">
  <meta name="theme-color" content="#393bb3">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75' font-family='system-ui'>🌡️</text></svg>">
  <title>Weather Dashboard</title>
  <!-- BootstrapCDN for CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
  <header class="row text-center text-white bg-primary p-3" id="header">
    <div class="d-flex justify-content-between align-items-center">
      <h1 class="flex-grow-1"> 🌡️ <strong> Weather Dashboard </strong>  </h1>
      <div class="d-flex gap-2 me-3">
        <button class="btn btn-outline-light btn-sm" id="theme-toggle" title="Toggle dark/light theme">
          🌙
        </button>
        <div class="btn-group" role="group" id="temp-unit-toggle">
          <input type="radio" class="btn-check" name="tempUnit" id="fahrenheit" value="F" checked>
          <label class="btn btn-outline-light" for="fahrenheit">°F</label>
          <input type="radio" class="btn-check" name="tempUnit" id="celsius" value="C">
          <label class="btn btn-outline-light" for="celsius">°C</label>
        </div>
      </div>
    </div>
  </header>

  <main class="row" id="main">
    <section class="column col-sm-6 col-md-4 col-lg-3 col-xl-3 col-xxl-2">
      <form class="change-area m-3 text-muted">
        <label class="text-secondery" for="city-input">
          <h4> Search for a City </h4>
        </label>
        <input id="city-input" type="text" name="city" class="form-control my-1 text-primary"
          placeholder="enter a city">
        <button class="btn btn-primary btn-lg my-1 search-button" type="submit" id="search-btn">Search</button>
        <button type="button" class="btn btn-secondary btn-lg" id="clear-btn">Clear History</button>
      </form>

      <div class="border-top border-secondary my-3 p-3">
        <h5 class="mb-3">⭐ Favorites</h5>
        <div class="d-flex flex-row flex-wrap justify-content-flex-start" id="favorite-cities">
          <p class="text-muted text-center w-100" id="no-favorites">No favorites yet</p>
        </div>
      </div>

      <div class="border-top border-secondary text-center d-flex flex-row flex-wrap justify-content-flex-start my-1 p-3"
        id="past-searched-cities">
        <h5 class="w-100 mb-3">🔍 Recent Searches</h5>
      </div>
    </section>

    <section class="column col-sm-6 col-md-8 col-lg-9 col-xl-9 col-xxl-10 ">
      <div class="error-message" id="error-message"></div>
      <div class="d-flex gap-2 mb-3">
        <button class="btn btn-info btn-sm" id="compare-btn" title="Compare with other cities">
          📊 Compare Cities
        </button>
        <button class="btn btn-outline-info btn-sm" id="clear-compare-btn" title="Clear comparison" style="display: none;">
          ✕ Clear Comparison
        </button>
      </div>
      <div id="weather-alerts" class="mb-3"></div>
      <div id="comparison-view" class="mb-5"></div>
      <div class="row p-1 current-weather border-top border-secondary m-2 shadow p-3 mb-5 bg-body-tertiary rounded">
        <h3>Current weather</h3>
        <div class="placeholder-content" id="weather-placeholder">
          <p>🔍 Search for a city to see current weather</p>
        </div>
        <div id="weather-content" style="display: none;"></div>
      </div>
      <section class="border-bottom border-secondary hourly-weather shadow p-3 mb-5 bg-body-tertiary rounded">
        <div class="row mb-3">
          <h3> 24-Hour Forecast </h3>
        </div>
        <div class="d-flex flex-row overflow-auto gap-2" id="hourly-weather" style="min-height: 150px;">
        </div>
      </section>

      <section class="border-bottom border-secondary five-day-weather shadow p-3 mb-5 bg-body-tertiary rounded">
        <div class="row mb-3">
          <h3> 5-Day Forecast </h3>
        </div>
        <div class="d-flex flex-row flex-wrap justify-content-flex-start gap-2" id="five-day-weather">
        </div>
      </section>
      </div>
      </div>
      </div>
    </section>
  </main>

  <!-- CDN resource -->
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
  <script type="module" src="./assets/js/main.js"></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then(registration => {
            console.log('Service Worker registered:', registration);
          })
          .catch(error => {
            console.log('Service Worker registration failed:', error);
          });
      });
    }
  </script>
</body>

</html>
